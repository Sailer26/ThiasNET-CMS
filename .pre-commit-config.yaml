repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy app
        entry: python -m mypy app
        language: system
        pass_filenames: false
        types: [python]
      - id: template-lock
        name: test template lock
        entry: python -m pytest tests/security -q
        language: system
        pass_filenames: false
        always_run: true
