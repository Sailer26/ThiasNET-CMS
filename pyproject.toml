[project]
name = "thiasnet-cms"
version = "0.1.0"
description = "ThiasNET CMS — CMS proprietario per i siti dei clienti ThiasNET"
requires-python = ">=3.12"
dependencies = [
    # Framework web previsto dallo stack (CLAUDE.md).
    "Flask==3.1.3",
    # Integrazione ORM con sessione per richiesta.
    "Flask-SQLAlchemy==3.1.1",
    # ORM 2.x previsto dallo stack.
    "SQLAlchemy==2.1.4",
    # Migrazioni Alembic obbligatorie (CLAUDE.md).
    "Flask-Migrate==4.1.0",
    # Validazione di theme.json e, dalla Fase 2, dei dati dei blocchi.
    "jsonschema==4.26.0",
    # Caricamento di .env in sviluppo.
    "python-dotenv==1.2.4",
    # Sessione utente e user_loader (stack CLAUDE.md).
    "Flask-Login==0.6.3",
    # Protezione CSRF (stack CLAUDE.md); WTForms arriva come dipendenza ma non lo usiamo.
    "Flask-WTF==1.3.0",
    # Hash delle password Argon2id con rehash (stack CLAUDE.md).
    "argon2-cffi==25.1.0",
    # TOTP RFC 6238 per il secondo fattore opzionale, senza dipendenze.
    "pyotp==2.10.0",
    # Fernet + HKDF: segreto TOTP cifrato a riposo e HMAC degli IP (D-28, D-30).
    "cryptography==50.0.2",
    # Sanitizzazione del rich text dei blocchi con allowlist (stack CLAUDE.md, D-49).
    "nh3==0.3.7",
    # Motore dei template del sito in sandbox (D-52); già usato da Flask, ora anche direttamente.
    "Jinja2==3.1.6",
    # Markup con escape automatico per gli helper del CMS (D-56).
    "MarkupSafe==3.0.4",
    # Token firmati del modulo contatti (D-61); già dipendenza di Flask.
    "itsdangerous==2.2.0",
    # Media: verifica del formato, re-encode senza metadati, varianti WebP (stack CLAUDE.md, D-84).
    "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-jsonschema==4.26.0.20261006",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schemas/*.json", "blocks/*.json", "data/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "T20", "ANN", "RUF", "PTH", "DTZ"]
# Any è inevitabile su JSON non ancora validato e sugli hook DB-API; mypy strict resta attivo.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Nei test le password sono fittizie per definizione (S105/S106).
"tests/**" = ["S101", "ANN", "S603", "E501", "S105", "S106"]
"scripts/**" = ["S603", "S607", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
# Pacchetti senza type hints (niente py.typed).
module = ["flask_migrate", "flask_login", "flask_login.*", "flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Nei test le fixture pytest non sono annotate: si controlla comunque il corpo delle funzioni.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
