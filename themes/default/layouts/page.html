{% extends "layouts/_base.html" %}
{% block content %}
<div class="container">
{% include "partials/breadcrumbs.html" %}
<h1 class="page-title">{{ page.title }}</h1>
<div class="with-sidebar{% if not zone_has_blocks('sidebar') %} with-sidebar--empty{% endif %}">
<div class="zone zone--main">
{{ render_zone("main") }}
</div>
{% if zone_has_blocks("sidebar") %}
<aside class="zone zone--sidebar" aria-label="{{ page.title }}">
{{ render_zone("sidebar") }}
</aside>
{% endif %}
</div>
</div>
{% endblock %}
