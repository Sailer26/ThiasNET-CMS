name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff + mypy)
        run: python scripts/tasks.py lint
      - name: Valida i temi
        run: python scripts/tasks.py theme-check
      - name: Test + coverage (soglia 80%)
        run: python scripts/tasks.py test

  admin:
    name: pannello (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Installa dipendenze
        run: npm ci --ignore-scripts
      - name: Lint (tsc + eslint)
        run: npm run lint
      - name: Test + coverage (soglia 80%)
        run: npm run test:coverage
      - name: Build + controllo CSP
        run: npm run build

  e2e:
    name: percorso nel browser (Chromium)
    runs-on: ubuntu-latest
    needs: [check, admin]
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Installa dipendenze
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts --prefix admin
      - name: Build del pannello
        run: npm run build --prefix admin
      - name: e2e
        run: python scripts/tasks.py e2e
